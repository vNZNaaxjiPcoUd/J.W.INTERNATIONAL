<!DOCTYPE html>
<html>
<head>
<title>J.W. INTERNET TECHNOLOGY</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon192.png">
<link rel="manifest" href="/webmanifest.json">
<style>
html,body,h1,h2,h3,h4 {font-family:"Lato", sans-serif}
.mySlides {display:none}
.w3-tag, .fa {cursor:pointer}
.w3-tag {height:15px;width:15px;padding:0;margin-top:6px}
* {
  box-sizing: border-box;
  border-radius: 5px;
}
h2[id] {
  scroll-margin-top: 70px; /* 請依實際導覽列高度調整 */
}

  /* 可選：讓畫面跳轉時呈現平滑捲動效果 */
html {
  scroll-behavior: smooth;
}
</style>
<script src="https://www.w3schools.com/lib/w3.js"></script>
</head>
<body>

<!-- Links (sit on top) -->
<div class="w3-top" style="max-width:1200px; left:0; right:0; margin:0 auto;">
  <div class="w3-row w3-large w3-light-grey" style="display: flex;">
    <a href="/" class="w3-button w3-block" style="flex: 1;">Home</a>
    <a href="/plan" class="w3-button w3-block" style="flex: 1;">Plan of Service</a>
    <a href="/dailynews" class="w3-button w3-block" style="flex: 1;">Service</a>
    <a href="/aboutus" class="w3-button w3-block" style="flex: 1;">About</a>
  </div>
</div>

<!-- Container -->
<div class="w3-content" style="max-width:1200px; margin:80px 2px; ">

  <div class="w3-panel">
    <h2><b>J.W. INTERNET TECHNOLOGY</b></h2>
    <p>Empower your Vision with seamlessly integrated technology solutions.</p>
    <p id="clock" class="w3-tiny">Now</p>

    <script>
    function myTimer() {
      const d = new Date();
      document.getElementById("clock").innerHTML = d.toLocaleTimeString('en-US');
    }
    myTimer();
    setInterval(myTimer, 1000);
    </script>
  </div>

  <!-- Slideshow -->
  <div class="w3-container">

    <!-- Slide 1 -->
    <div class="w3-display-container mySlides" onclick="location.href='plan#Premium'" style="cursor:pointer;">
      <img src="/webb2.jpg" style="width:100%; height:126px; object-fit:cover; object-position:center;">
      <div class="w3-display-topleft w3-container w3-padding-tiny">
        <span class="w3-white w3-padding-tiny w3-animate-bottom"> Premium </span>
      </div>
    </div>

    <!-- Slide 2 -->
    <div class="w3-display-container mySlides" onclick="location.href='plan#Pro'" style="cursor:pointer;">
      <img src="/w2.jpg" style="width:100%; height:126px; object-fit:cover; object-position:center;">
      <div class="w3-display-topleft w3-container w3-padding-tiny">
        <span class="w3-white w3-padding-tiny w3-animate-bottom"> Pro </span>
      </div>
    </div>

    <!-- Slide 3 -->
    <div class="w3-display-container mySlides" onclick="location.href='plan#Standard'" style="cursor:pointer;">
      <img src="/w1.jpg" style="width:100%; height:126px; object-fit:cover; object-position:center;">
      <div class="w3-display-topleft w3-container w3-padding-tiny">
        <span class="w3-white w3-padding-tiny w3-animate-bottom"> Standard </span>
      </div>
    </div>

    <!-- Slideshow next/previous buttons -->
    <div class="w3-dark-grey w3-medium" style="display: flex; align-items: center; justify-content: space-between; padding: 4px 8px;">
      <!-- 左箭頭 -->
      <div onclick="plusDivs(-1)" style="width: 15%; text-align: left; cursor: pointer; display: flex; align-items: center;">
        <i class="fa fa-arrow-circle-left w3-hover-text-teal"></i>
      </div>

      <!-- 中間指示點 -->
      <div style="display: flex; align-items: center; justify-content: center; gap: 4px;">
        <span class="w3-tag demodots w3-border w3-transparent w3-hover-white" onclick="currentDiv(1)"></span>
        <span class="w3-tag demodots w3-border w3-transparent w3-hover-white" onclick="currentDiv(2)"></span>
        <span class="w3-tag demodots w3-border w3-transparent w3-hover-white" onclick="currentDiv(3)"></span>
      </div>

      <!-- 右箭頭 -->
      <div onclick="plusDivs(1)" style="width: 15%; text-align: right; cursor: pointer; display: flex; align-items: center; justify-content: flex-end;">
        <i class="fa fa-arrow-circle-right w3-hover-text-teal"></i>
      </div>
    </div>

  </div>

  <script>
    var slideIndex = 1;
    showDivs(slideIndex);
    
    function plusOne() {
      showDivs(slideIndex += 1);
    }
    function plusDivs(n) {
      showDivs(slideIndex += n);
    }
    function currentDiv(n) {
      showDivs(slideIndex = n);
    }
    function showDivs(n) {
      var i;
      var x = document.getElementsByClassName("mySlides");
      var dots = document.getElementsByClassName("demodots");
      if (n > x.length) {slideIndex = 1}    
      if (n < 1) {slideIndex = x.length} ;
      for (i = 0; i < x.length; i++) {
        x[i].style.display = "none";  
      }
      for (i = 0; i < dots.length; i++) {
        dots[i].className = dots[i].className.replace(" w3-white", "");
      }
      x[slideIndex-1].style.display = "block";  
      dots[slideIndex-1].className += " w3-white";
    }
    setInterval(plusOne, 56789);
  </script>
  <div>
  {{ content }}
  </div>
</div>

<!-- Footer -->
<footer class="w3-container w3-padding-32 w3-light-grey w3-center" style="max-width:1200px; margin:0 auto;">
  <h4>J.W. INTERNET TECHNOLOGY</h4>
  <p>Powered by <a href="https://www.jwint.net" title="JWINT" class="w3-hover-text-green">JWINT design center</a></p>
</footer>

</body>
</html>
