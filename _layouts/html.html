<!DOCTYPE html>
<html>
<head>
<title>J.W.INT.</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
<link rel="manifest" href="/webmanifest">
<style>
html,body,h1,h2,h3,h4 {font-family:"Lato", sans-serif}
.mySlides {display:none}
.w3-tag, .fa {cursor:pointer}
.w3-tag {height:15px;width:15px;padding:0;margin-top:6px}
* {
      box-sizing: border-box;
      border-radius: 5px;
    }
</style>
<script src="https://www.w3schools.com/lib/w3.js"></script>
</head>
<body>

<!-- Links (sit on top) -->
<div class="w3-top">
  <div class="w3-row w3-large w3-light-grey">
    <div class="w3-col s3">
      <a href="/" class="w3-button w3-block">Home</a>
    </div>
    <div class="w3-col s3">
      <a href="/plan" class="w3-button w3-block">Plans</a>
    </div>
    <div class="w3-col s3">
      <a href="/dailynews" class="w3-button w3-block">News</a>
    </div>
    <div class="w3-col s3">
      <a href="/aboutus" class="w3-button w3-block">About</a>
    </div>
  </div>
</div>

<!-- contain -->
<div class="w3-content" style="max-width:1100px;margin-top:80px;margin-bottom:80px">

	<div class="w3-panel">
		<h2><b>J. W. International</b></h2>
		<p>IT service solution for you <a href="/uu" target="_blank">!</a></p>
    <p id="clock" class="w3-tiny">Now</p>

    <script>

    function myTimer() {
      const d = new Date();
      document.getElementById("clock").innerHTML = d.toLocaleTimeString('en-US');
    }
    myTimer();
    setInterval(myTimer, 1000);

    </script>
	</div>


	
  <!-- Slideshow -->
  <div class="w3-container">
    <div class="w3-display-container mySlides">
      <img src="/webb2.jpg" style="width:100%">
      <div class="w3-display-topleft w3-container w3-padding-tiny">
        <span class="w3-white w3-padding-tiny w3-animate-bottom"> Premium </span>
      </div>
    </div>
    <div class="w3-display-container mySlides">
      <img src="/w2.jpg" style="width:100%">
      <div class="w3-display-topleft w3-container w3-padding-tiny">
        <span class="w3-white w3-padding-tiny w3-animate-bottom"> Pro </span>
      </div>
    </div>
    <div class="w3-display-container mySlides">
      <img src="/w1.jpg" style="width:100%">
      <div class="w3-display-topleft w3-container w3-padding-tiny">
        <span class="w3-white w3-padding-tiny w3-animate-bottom"> Basic </span>
      </div>
    </div>

    <!-- Slideshow next/previous buttons -->
    <div class="w3-container w3-dark-grey w3-padding-small w3-large">
      <div class="w3-left" onclick="plusDivs(-1)"><i class="fa fa-arrow-circle-left w3-hover-text-teal"></i></div>
      <div class="w3-right" onclick="plusDivs(1)"><i class="fa fa-arrow-circle-right w3-hover-text-teal"></i></div>
    
      <div class="w3-center">
        <span class="w3-tag demodots w3-border w3-transparent w3-hover-white" onclick="currentDiv(1)"></span>
        <span class="w3-tag demodots w3-border w3-transparent w3-hover-white" onclick="currentDiv(2)"></span>
        <span class="w3-tag demodots w3-border w3-transparent w3-hover-white" onclick="currentDiv(3)"></span>
      </div>
    </div>
  </div>

  <script>
    // Slideshow
    var slideIndex = 1;
    showDivs(slideIndex);
    
    function plusOne() {
      showDivs(slideIndex += 1);
    }
    function plusDivs(n) {
      showDivs(slideIndex += n);
    }
    
    function currentDiv(n) {
      showDivs(slideIndex = n);
    }
    
    function showDivs(n) {
      var i;
      var x = document.getElementsByClassName("mySlides");
      var dots = document.getElementsByClassName("demodots");
      if (n > x.length) {slideIndex = 1}    
      if (n < 1) {slideIndex = x.length} ;
      for (i = 0; i < x.length; i++) {
        x[i].style.display = "none";  
      }
      for (i = 0; i < dots.length; i++) {
        dots[i].className = dots[i].className.replace(" w3-white", "");
      }
      x[slideIndex-1].style.display = "block";  
      dots[slideIndex-1].className += " w3-white";
    }
    
    // w3.slideshow(".mySlides", 5000);
    setInterval(plusOne, 56789);

  </script>
  

	{{ content }}


</div>
<!-- Footer -->

<footer class="w3-container w3-padding-32 w3-light-grey w3-center">
  <h4>J.W. International</h4>
  <a href="#" class="w3-button w3-black w3-margin"><i class="fa fa-arrow-up w3-margin-right"></i>To the top</a>
  <div class="w3-xlarge w3-section">
    <i class="fa fa-facebook-official w3-hover-opacity" onclick="location.href='/ctsrv';"></i>
    <i class="fa fa-instagram w3-hover-opacity" onclick="location.href='/ctsrv';"></i>
    <i class="fa fa-twitter w3-hover-opacity" onclick="location.href='/ctsrv';"></i>
    <i class="fa fa-linkedin w3-hover-opacity" onclick="location.href='/ctsrv';"></i>
  </div>
  <p>Powered by <a href="https://www.jwint.net" title="jwint design center" target="_blank" class="w3-hover-text-green">jwint design center</a></p>
</footer>




</body>
</html>
