<style>
  .grid-item {
    position: relative;
    width: 100%;
    height: 0;
    padding-bottom: 100%;   /* 這行讓寬高等於高，形成正方形！ */
    overflow: hidden;
    background: #ffffff;    /* 可選：沒圖時的底色 */
  }
  .grid-item img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;    /* 完整顯示不變形（推薦） */
    /* 想要填滿裁切改成 object-fit: cover; */
    /* object-fit: contain;    完整顯示不變形（推薦） */
  }
</style>

<style>
  /* 將卡片與內部容器轉換為彈性布局以實現等高對齊 */
  .w3-card-4 {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  
  .w3-container {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }
  
  /* 確保空白 h3 標題維持標準單行高度 */
  .w3-container h3 {
    min-height: 1.2em;
    margin-top: 10px;
    margin-bottom: 10px;
  }
  
  /* 將卡片最底部的按鈕推至最下方齊平 */
  .w3-container p:last-child {
    margin-top: auto;
  }
</style>
