<style>
  .justified-text {
    text-align: justify;
  }

</style>

<div style="font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Microsoft JhengHei', sans-serif; background-color: #ffffff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100dvh; width: 100%; padding: 0; color: #0f172a; box-sizing: border-box; overflow: hidden;">
  <div class="chat-container" style="background-color: #ffffff; border: none; border-radius: 0; padding: 24px; width: 100%; height: 100%; display: flex; flex-direction: column; box-sizing: border-box;">
      
      <!-- 標題區 -->
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-shrink: 0;">
          <div style="width: 4px; height: 24px; background-color: #1d4ed8; border-radius: 2px; flex-shrink: 0;"></div>
          <h2 id="ntTitle" style="margin: 0; font-size: 22px; font-weight: 700; color: #0f172a; letter-spacing: -0.3px;">Contact to JWINT</h2>
      </div>

      <!-- 說明文字 -->
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-shrink: 0;">
          <h3 style="margin: 0; font-size: 15px; font-weight: 400; color: #0f172a; letter-spacing: -0.3px; line-height: 1.5;" class="justified-text">
          Thank you for your interest in our services. Please submit your message below to schedule a comprehensive one-on-one consultation, during which we will discuss your specific requirements in detail.
          </h3>
      </div>
      
      <!-- 輸入表單區（填滿垂直剩餘空間） -->
      <div class="input-group" style="display: flex; flex-direction: column; gap: 16px; flex-grow: 1; box-sizing: border-box; width: 100%; min-height: 0;">
          <input id="ntName" type="email" placeholder="your email address" style="width: 100%; padding: 14px 18px; font-size: 15px; font-family: inherit; border: none; background-color: #f1f5f9; border-radius: 10px; outline: none; color: #0f172a; transition: all 0.2s ease; box-sizing: border-box; flex-shrink: 0;">
          
          <textarea id="ntMsgInput" placeholder="leave your message!" style="width: 100%; padding: 14px 18px; font-size: 15px; font-family: inherit; border: none; background-color: #f1f5f9; border-radius: 10px; outline: none; color: #0f172a; transition: all 0.2s ease; resize: none; flex-grow: 1; box-sizing: border-box; min-height: 120px;"></textarea>
          
          <button id="ntSendBtn" style="width: 100%; background-color: #1d4ed8; color: #ffffff; border: none; padding: 14px 22px; font-size: 16px; font-weight: 600; border-radius: 10px; cursor: pointer; white-space: nowrap; transition: background-color 0.2s, transform 0.1s; height: 48px; flex-shrink: 0; box-sizing: border-box; box-shadow: 0 4px 12px rgba(29, 78, 216, 0.25);">Go!</button>
      </div>

      <!-- 底部 Email 區塊 -->
      <div style="margin-top: 20px; flex-shrink: 0; word-break: break-all;">
        <a href="mailto:service@jwint.net" style="margin: 0; font-size: 15px; font-weight: 700; color: #0f172a; letter-spacing: -0.3px; text-decoration: none;">Service Email service@jwint.net</a>
